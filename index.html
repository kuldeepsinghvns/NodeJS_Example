<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Two-Way Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #chat {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            height: 400px;
            background-color: #6361614f;
            margin-bottom: 10px;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
            width: 80%;
        }

        button {
            position: relative;
            padding: 10px;
            background-color: #19BA92;
            border-radius: 100px;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            width: 15%;
        }

        button:hover {
            background-color: #19BA92;
        }

        .message {
            max-width: 48%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .message.sent {
            text-align: right;
            align-self: flex-end;
            color: white;
            background-color: #128C7E;
        }

        .message.received {
            text-align: left;
            align-self: flex-start;
            color: white;
            background-color: #075E54;
        }

        .shadow {
            box-shadow: 10px 20px 5px 10px rgb(116, 115, 115);
        }

        h2 {
            background-color: rgba(0, 0, 0, 0.777);
            border: #c6cdcc solid 2px;
            color: rgb(240, 232, 235);
        }
    </style>
</head>

<body>
    <div class="container">
        <br>
        <div class="row">
            <div class="col-md-4"></div>
            <div class="col-md-4 text-center shadow">
                <h2>Two-Way Chat</h2>
            </div>
            <div class="col-md-4"></div>
        </div>

        <div class="row">
            <div class="col-md-4 col-lg-3"></div>
            <div class="col-md-4 col-lg-6 shadow">
                <div>
                    <br>
                    <div id="chat"></div>
                </div>
                <div class="mb-3 d-flex">
                    <input type="text" id="messageInput" placeholder="Type a message..." autofocus
                        class="flex-grow-1 me-2">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
            <div class="col-md-4 col-lg-3"></div>
        </div>
    </div>

    <script>
        // WebSocket Configuration
        const socket = new WebSocket('ws://localhost:8080');

        socket.onopen = function () {
            console.log('Connected to WebSocket server');
        };

        socket.onerror = function (error) {
            console.error('WebSocket error: ', error);
        };

        socket.onmessage = function (event) {
            if (typeof event.data === 'string') {
                appendMessage(`Received: ${event.data}`, 'received');
            }
        };



        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (message) {
                socket.send(message);
                appendMessage(`You: ${message}`, 'sent');

                input.value = '';
                input.focus();
            }
        }

        function appendMessage(message, type) {
            const chat = document.getElementById('chat');
            const messageDiv = document.createElement('div');
            messageDiv.textContent = message;
            messageDiv.classList.add('message', type);
            chat.appendChild(messageDiv);
            chat.scrollTop = chat.scrollHeight; // Scroll to bottom
        }
    </script>

    <!-- Firebase -->

</body>

</html>
